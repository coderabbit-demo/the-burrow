<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>THE BURROW</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #06050a;
      color: #c9a449;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      box-shadow: 0 0 80px #000 inset;
    }
    #footer {
      position: fixed;
      bottom: 6px;
      right: 10px;
      font-size: 10px;
      color: #5a4a6b;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="footer">THE BURROW — A CODERABBIT TALE</div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
